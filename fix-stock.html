<!DOCTYPE html>
<html>
<head>
    <title>Fix Raw Materials Stock</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Fix Raw Materials Stock from Received POs</h1>
    <button onclick="fixStock()" style="padding: 20px; font-size: 18px; cursor: pointer;">
        Click to Fix Stock
    </button>
    <pre id="output"></pre>

    <script>
        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDSl7jI_dGssIso46W0NVJg1e4DlN9KN34",
            authDomain: "grabio-63a09.firebaseapp.com",
            projectId: "grabio-63a09",
            storageBucket: "grabio-63a09.firebasestorage.app",
            messagingSenderId: "624982563530",
            appId: "1:624982563530:web:93a4ab2e8afb7950f3ace0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function fixStock() {
            const output = document.getElementById('output');
            output.textContent = 'Starting fix...\n';

            try {
                // Get all received purchase orders
                const posSnapshot = await db.collection('purchases')
                    .where('status', '==', 'received')
                    .get();

                output.textContent += `Found ${posSnapshot.docs.length} received POs\n\n`;

                // Group items by rawMaterialId
                const materialUpdates = {};

                posSnapshot.forEach(doc => {
                    const po = doc.data();
                    output.textContent += `Processing PO: ${po.poNumber || po.invoiceNumber}\n`;
                    
                    po.items.forEach(item => {
                        const receivedQty = item.receivedQuantity || item.quantity || 0;
                        const unitCost = item.unitCost || item.unitPrice || 0;
                        
                        if (!materialUpdates[item.rawMaterialId]) {
                            materialUpdates[item.rawMaterialId] = {
                                totalQty: 0,
                                totalValue: 0,
                                name: item.materialName
                            };
                        }
                        
                        materialUpdates[item.rawMaterialId].totalQty += receivedQty;
                        materialUpdates[item.rawMaterialId].totalValue += receivedQty * unitCost;
                        
                        output.textContent += `  - ${item.materialName}: +${receivedQty} units\n`;
                    });
                });

                output.textContent += '\n--- Updating Raw Materials ---\n';

                // Update each raw material
                for (const [materialId, update] of Object.entries(materialUpdates)) {
                    const materialRef = db.collection('rawMaterials').doc(materialId);
                    const materialDoc = await materialRef.get();
                    
                    if (materialDoc.exists()) {
                        const currentStock = materialDoc.data().currentStock || 0;
                        const newStock = currentStock + update.totalQty;
                        const avgCost = update.totalValue / update.totalQty;
                        
                        await materialRef.update({
                            currentStock: newStock,
                            costPerUnit: avgCost,
                            updatedAt: new Date().toISOString()
                        });
                        
                        output.textContent += `✅ ${update.name}: ${currentStock} → ${newStock} units\n`;
                    } else {
                        output.textContent += `⚠️ Material ${update.name} not found!\n`;
                    }
                }

                output.textContent += '\n✅ DONE! Refresh your Raw Materials page to see updated stock.\n';
            } catch (error) {
                output.textContent += `\n❌ ERROR: ${error.message}\n`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
