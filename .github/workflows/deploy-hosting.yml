name: Deploy Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-hosting.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE: https://api-5nbn2jdbxa-uc.a.run.app
          VITE_FIREBASE_AUTH_DOMAIN: market-flow-7b074.firebaseapp.com
          VITE_GOOGLE_CLIENT_ID: 997465465802-aa8arghkqbm9jjdvokmgfr1adu17ih2e.apps.googleusercontent.com
          VITE_GSC_PROPERTY: https://grabio.space/
          VITE_ECOSYSTEM_MODULAR: 'true'
          VITE_ECOSYSTEM_PACKAGE_DRAFT: 'true'
          VITE_ECOSYSTEM_MODULAR_CHECKOUT: 'true'
          VITE_ECOSYSTEM_ENFORCE_MODULES: 'true'
          VITE_PUBLIC_PRODUCT_STOCK_API: 'true'

      - name: Verify modular flags in bundle
        run: |
          rg -q 'VITE_ECOSYSTEM_MODULAR:"true"' dist/assets/index-*.js
          rg -q 'modularCheckout' dist/assets/index-*.js

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing on this repo. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          npx firebase-tools deploy --only hosting --project market-flow-7b074 --non-interactive
