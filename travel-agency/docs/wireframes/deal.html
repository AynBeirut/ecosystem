<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe — Deal workspace</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .stage { color: #0891b2; font-size: 13px; font-weight: 600; }
    .timeline li { font-size: 13px; margin-bottom: 8px; color: #475569; }
    .actions button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; text-align: left; }
    .actions button.primary { background: #06b6d4; color: #fff; border-color: #06b6d4; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="panel">
      <p class="stage">Quoted</p>
      <h1>Dubai — Sharma family (4 pax)</h1>
      <p style="color:#64748b;font-size:14px;">QT-2026-10-01-002 · Margin ₹12,400 (18%)</p>
      <h3 style="font-size:14px;margin-top:20px;">Timeline</h3>
      <ul class="timeline">
        <li>WhatsApp — follow-up sent</li>
        <li>Quote v2 shared (link)</li>
        <li>Inquiry — honeymoon package</li>
      </ul>
      <h3 style="font-size:14px;">Itinerary (summary)</h3>
      <p style="font-size:13px;">Day 1–5 hotel + transfers · Flights TBD after deposit</p>
    </div>
    <div class="panel actions">
      <button class="primary">Send / resend quote</button>
      <button>Record deposit</button>
      <button>Book flights (Nextra)</button>
      <button>Add note / call log</button>
      <p style="font-size:12px;color:#94a3b8;">PNR: — · Booking ref: —</p>
    </div>
  </div>
</body>
</html>
